    ja_JP: browserless_agent
description:
  human:
    en_US: "Execute a browser command in a persistent agent session. ## Core Loop (ReAct: Reason → Act → Observe) 1. **goto** to navigate — waits for \"domcontentloaded\" by default 2. **snapshot** to observe the page — returns interactive and informatio"
    zh_Hans: "Execute a browser command in a persistent agent session. ## Core Loop (ReAct: Reason → Act → Observe) 1. **goto** to navigate — waits for \"domcontentloaded\" by default 2. **snapshot** to observe the page — returns interactive and informatio"
    pt_BR: "Execute a browser command in a persistent agent session. ## Core Loop (ReAct: Reason → Act → Observe) 1. **goto** to navigate — waits for \"domcontentloaded\" by default 2. **snapshot** to observe the page — returns interactive and informatio"
    ja_JP: "Execute a browser command in a persistent agent session. ## Core Loop (ReAct: Reason → Act → Observe) 1. **goto** to navigate — waits for \"domcontentloaded\" by default 2. **snapshot** to observe the page — returns interactive and informatio"
  llm: "Execute a browser command in a persistent agent session. ## Core Loop (ReAct: Reason → Act → Observe) 1. **goto** to navigate — waits for \"domcontentloaded\" by default 2. **snapshot** to observe the page — returns interactive and informatio"
parameters:
  - name: method
    type: string
    required: false
    default: ""
    label:
      en_US: method
      zh_Hans: method
      pt_BR: method
      ja_JP: method
    human_description:
      en_US: "The BQL method to execute (used for single-command calls). When using \"commands\" array, this field is ignored."
      zh_Hans: "The BQL method to execute (used for single-command calls). When using \"commands\" array, this field is ignored."
      pt_BR: "The BQL method to execute (used for single-command calls). When using \"commands\" array, this field is ignored."
      ja_JP: "The BQL method to execute (used for single-command calls). When using \"commands\" array, this field is ignored."
    llm_description: "The BQL method to execute (used for single-command calls). When using \"commands\" array, this field is ignored."
    form: llm
  - name: params
    type: string
    required: false
    default: "{}"
    label:
      en_US: params
      zh_Hans: params
      pt_BR: params
      ja_JP: params
    human_description:
      en_US: "Parameters for the method (used for single-command calls)."
      zh_Hans: "Parameters for the method (used for single-command calls)."
      pt_BR: "Parameters for the method (used for single-command calls)."
      ja_JP: "Parameters for the method (used for single-command calls)."
    llm_description: "Parameters for the method (used for single-command calls). Provide as JSON."
    form: llm
  - name: commands
    type: string
    required: false
    label:
      en_US: commands
      zh_Hans: commands
      pt_BR: commands
      ja_JP: commands
    human_description:
      en_US: "Optional: batch multiple commands in one call. When provided, \"method\" and \"params\" are ignored and commands are executed sequentially. Only the final result is returned. Use this to batch actions that share the same page state (e.g. filling a form: type email + type password + click submit). Do NOT batch across navigations."
      zh_Hans: "Optional: batch multiple commands in one call. When provided, \"method\" and \"params\" are ignored and commands are executed sequentially. Only the final result is returned. Use this to batch actions that share the same page state (e.g. filling a form: type email + type password + click submit). Do NOT batch across navigations."
      pt_BR: "Optional: batch multiple commands in one call. When provided, \"method\" and \"params\" are ignored and commands are executed sequentially. Only the final result is returned. Use this to batch actions that share the same page state (e.g. filling a form: type email + type password + click submit). Do NOT batch across navigations."
      ja_JP: "Optional: batch multiple commands in one call. When provided, \"method\" and \"params\" are ignored and commands are executed sequentially. Only the final result is returned. Use this to batch actions that share the same page state (e.g. filling a form: type email + type password + click submit). Do NOT batch across navigations."
    llm_description: "Optional: batch multiple commands in one call. When provided, \"method\" and \"params\" are ignored and commands are executed sequentially. Only the final result is returned. Use this to batch actions that share the same page state (e.g. filling a form: type email + type password + click submit). Do NOT batch across navigations. Provide as JSON."
